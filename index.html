        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }

        .animate-reveal {

    <script>
        // Инициализация аудиоконтекста
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        ['click', 'touchstart', 'scroll'].forEach(evt => {
            document.addEventListener(evt, () => getAudioContext(), { passive: true, once: true });
        });

        // Звук клика (тактильный щелчок)
        function playClickSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx || ctx.state === 'suspended') return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        // Звук скроллинга (Трещотка)
        let lastScrollTickTime = 0;
        let lastScrollTop = 0;
        let accumulatedScrollDist = 0;
        
        function playTickSound(scrollSpeed = 1) {
            try {
                const now = Date.now();
                if (scrollSpeed < 0.2) return;
                
                accumulatedScrollDist += scrollSpeed * 12;
                const threshold = Math.max(60, Math.min(220, 220 / (scrollSpeed * 0.5)));
                
                if (accumulatedScrollDist < threshold) return;
                if (now - lastScrollTickTime < 40) return;
                
                accumulatedScrollDist = 0;
                lastScrollTickTime = now;
                
                const ctx = getAudioContext();
                if (!ctx || ctx.state === 'suspended') return;
                
                const osc = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'square';
                osc2.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(240, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.02);
                
                osc2.frequency.setValueAtTime(480, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.02);
                
                gain.gain.setValueAtTime(0.03, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
                
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc2.start();
                osc.stop(ctx.currentTime + 0.02);
                osc2.stop(ctx.currentTime + 0.02);
            } catch (e) {}
        }

        window.addEventListener('scroll', () => {
            const currentScrollTop = window.scrollY;
            const timeDiff = 16;
            const scrollDist = Math.abs(currentScrollTop - lastScrollTop);
            const speed = scrollDist / timeDiff;
            
            playTickSound(speed);
            lastScrollTop = currentScrollTop;
        }, { passive: true });

        // Эффект параллакса на ПК
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            
            document.querySelectorAll('.parallax-shape').forEach(shape => {
                const speed = parseFloat(shape.getAttribute('data-speed'));
                shape.style.transform = `translate(${x * speed * 100}px, ${y * speed * 100}px)`;
            });
        });

        function getTimeLeftHtml(timeStr) {
            if (!timeStr || timeStr === '-' || !timeStr.includes('-')) return '';
            const now = new Date();
            const currentTotalMins = now.getHours() * 60 + now.getMinutes();
            const [startStr, endStr] = timeStr.split('-');
            if (!startStr || !endStr) return '';
            
            const [startH, startM] = startStr.split(':').map(Number);
            const [endH, endM] = endStr.split(':').map(Number);
            if (isNaN(startH) || isNaN(endH)) return '';

            const startTotalMins = startH * 60 + (startM || 0);
            let endTotalMins = endH * 60 + (endM || 0);
            if (endTotalMins < startTotalMins) endTotalMins += 24 * 60; 

            if ((currentTotalMins >= startTotalMins && currentTotalMins <= endTotalMins) || 
                (startTotalMins > endTotalMins && (currentTotalMins >= startTotalMins || currentTotalMins <= endTotalMins))) {
                return `<div class="text-[10px] text-emerald-700 font-extrabold animate-pulse px-2 py-0.5 rounded-md bg-emerald-50 inline-flex items-center gap-1 border border-emerald-100 mt-1"><span>🔥</span> Разгрузка идет</div>`;
            }

            let diff = startTotalMins - currentTotalMins;
            if (diff < 0) diff += 24 * 60;

            const h = Math.floor(diff / 60);
            const m = diff % 60;

            let colorClass = 'text-gray-400';
            if (h < 4) colorClass = 'text-amber-500 font-bold';

            return `<div class="text-[10px] ${colorClass} mt-1">⏱ До начала: ${h}ч ${m}м</div>`;
        }

                const matchesSearch = searchWords.every(word => fullText.includes(word));
                                      
                let matchesFilter = true;
                if (filterVal === '24/7' && !store.is24_7) matchesFilter = false;
                if (filterVal === 'limited' && store.is24_7) matchesFilter = false;
                if (selectedCityFilter !== 'all' && store.city !== selectedCityFilter) matchesFilter = false;

                return matchesSearch && matchesFilter;
            });

            if (suggestions.length > 0) {
                autocompleteList.classList.remove('hidden');
                
                suggestions.slice(0, 20).forEach(store => {
                    const item = document.createElement('div');
                    item.className = 'px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-none transition-colors mx-1 my-0.5 text-gray-800';
                    
                    item.innerHTML = getDropdownItemHTML(store);
                    
                    item.addEventListener('click', () => {
                        playClickSound();
                        searchInput.value = store.tk !== '-' ? store.tk : store.city; 
                        autocompleteList.classList.add('hidden');
                        renderCards();
                    });
                    
                    autocompleteList.appendChild(item);
                });
            } else {
                autocompleteList.classList.add('hidden');
            }
        });

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !autocompleteList.contains(e.target)) {
                autocompleteList.classList.add('hidden');
            }
            if (!customFilterBtn.contains(e.target) && !customFilterList.contains(e.target)) {
                customFilterList.classList.add('hidden');
            }
        });

        window.startVoiceSearch = function() {
            const micBtn = document.getElementById('voiceSearchBtn');
            const searchInput = document.getElementById('searchInput');
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                searchInput.placeholder = "Микрофон не поддерживается";
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU'; 
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                
                recognition.onstart = function() {
                    micBtn.classList.add('mic-pulsing', 'bg-red-500', 'text-white', 'border-red-500');
                    micBtn.classList.remove('text-lentaBlue');
                    searchInput.value = '';
                    searchInput.placeholder = "Слушаю вас...";
                };
                
                recognition.onresult = function(event) {
                    const speechResult = event.results[0][0].transcript;
                    searchInput.value = speechResult.replace(/\.$/, '').trim();
                    searchInput.dispatchEvent(new Event('input'));
                };
                
                recognition.onerror = function() {
                    resetMic();
                    searchInput.placeholder = "Повторите запрос...";
                };
                
                recognition.onend = function() { 
                    resetMic(); 
                };
                
                function resetMic() {
                    micBtn.classList.remove('mic-pulsing', 'bg-red-500', 'text-white', 'border-red-500');
                    micBtn.classList.add('text-lentaBlue');
                    searchInput.placeholder = "Поиск по ТК, городу, адресу...";
                }
                
                recognition.start();
            } catch (e) {
                resetMic();
                searchInput.placeholder = "Ошибка микрофона";
            }
        };

        // Запуск
        setInterval(renderCards, 60000);
        renderCards();
    </script>
</body>
</html>
