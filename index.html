        /* 3D Параллакс фон */
        .parallax-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .parallax-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 0.6;
        }
        .shape-1 { width: 40vw; height: 40vw; background: rgba(253, 203, 5, 0.2); top: -10%; left: -10%; }
        .shape-2 { width: 50vw; height: 50vw; background: rgba(0, 65, 130, 0.15); bottom: -15%; right: -15%; }

        /* 3D Карточки с плавной анимацией */
        .store-card {

            will-change: transform, opacity;
        }
        .store-card:active {
            transform: scale(0.97) translateY(4px);
            box-shadow: 0 5px 15px -5px rgba(0,0,0,0.05);
        }
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-reveal {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .city-slider {
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain; 
            scroll-behavior: smooth;
        }

        .tactile-btn {
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
        }
        .tactile-btn:active {

    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        ['click', 'touchstart', 'scroll'].forEach(evt => {
            document.addEventListener(evt, () => getAudioContext(), { passive: true, once: true });
        });

        function playClickSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx || ctx.state === 'suspended') return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        let lastScrollTickTime = 0;
        let lastScrollTop = 0;
        let accumulatedScrollDist = 0;
        
        function playTickSound(scrollSpeed = 1) {
            try {
                const now = Date.now();
                if (scrollSpeed < 0.2) return;
                
                accumulatedScrollDist += scrollSpeed * 12;
                const threshold = Math.max(60, Math.min(220, 220 / (scrollSpeed * 0.5)));
                
                if (accumulatedScrollDist < threshold) return;
                if (now - lastScrollTickTime < 40) return;
                
                accumulatedScrollDist = 0;
                lastScrollTickTime = now;
                
                const ctx = getAudioContext();
                if (!ctx || ctx.state === 'suspended') return;
                
                const osc = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'square';
                osc2.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(240, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.02);
                
                osc2.frequency.setValueAtTime(480, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.02);
                
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
                
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc2.start();
                osc.stop(ctx.currentTime + 0.02);
                osc2.stop(ctx.currentTime + 0.02);
            } catch (e) {}
        }

        window.addEventListener('scroll', () => {
            const currentScrollTop = window.scrollY;
            const timeDiff = 16;
            const scrollDist = Math.abs(currentScrollTop - lastScrollTop);
            const speed = scrollDist / timeDiff;
            
            playTickSound(speed);
            lastScrollTop = currentScrollTop;
        }, { passive: true });

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            
            document.querySelectorAll('.parallax-shape').forEach(shape => {
                const speed = parseFloat(shape.getAttribute('data-speed'));
                shape.style.transform = `translate(${x * speed * 100}px, ${y * speed * 100}px)`;
            });
        });
